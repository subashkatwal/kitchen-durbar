# Auto-merged by `docker compose up` for local development:
# - backend runs Django's autoreloading dev server against a bind-mounted source tree
# - frontend runs the Vite dev server (hot reload) on :5173 instead of the nginx/prod image
#
# Run `docker compose -f docker-compose.yml up --build -d` (without this file) for a
# prod-like run: gunicorn + nginx, no bind mounts, frontend built once and served statically.
services:
  backend:
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment:
      DJANGO_DEBUG: "1"
    volumes:
      - ./kitchen-durbar-backend:/app

  frontend:
    build:
      target: dev
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
      VITE_WHATSAPP_NUMBER: ${VITE_WHATSAPP_NUMBER:-+9779769400796}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    volumes:
      - ./kitchen-durbar-frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  frontend_node_modules:
