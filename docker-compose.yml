services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kd_net

  backend:
    build:
      context: ./kitchen-durbar-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    networks:
      - kd_net

  frontend:
    build:
      context: ./kitchen-durbar-frontend
      target: prod
      args:
        VITE_API_URL: /api/v1
        VITE_WHATSAPP_NUMBER: ${VITE_WHATSAPP_NUMBER:-+9779769400796}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-9004}:80"
    networks:
      - kd_net

volumes:
  pg_data:
  static_data:

networks:
  kd_net:
    driver: bridge
