server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Only reachable when VITE_API_URL was built as a relative path (plain
    # `docker compose up`, where "backend" resolves via Compose's embedded
    # DNS at 127.0.0.11). On Render (and anywhere VITE_API_URL is baked in as
    # an absolute URL - see render.yaml) the frontend calls the backend
    # directly and never hits these locations. Proxy targets are kept in
    # variables so nginx resolves "backend" lazily per-request instead of at
    # config load - otherwise nginx refuses to start at all when "backend"
    # isn't a resolvable host, which is exactly the case on Render.
    resolver 127.0.0.11 valid=30s;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the Django backend service
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django's own admin site - kept at a distinct prefix so it never shadows
    # the React app's own /admin dashboard route (handled by the SPA fallback
    # above).
    location /django-admin/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream/django-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream/static/;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
